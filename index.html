<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Order</title>
<meta name="description" content="A turn-based geopolitics game for the NewUU politics club.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: a war-room table. HUD strip on top, the world map is the board, side panels are dossiers. One deliberate dark look (single theme by choice). */
:root {
  color-scheme: dark;
  --bg: #0A1017; --panel: #111A24; --panel2: #16212D; --line: #243241; --line2: #31445A;
  --ink: #E8EEF4; --muted: #8B9BAD; --dim: #5B6B7D;
  --sea: #0C151F; --land: #1C2833; --land-edge: #0A1017;
  --accent: #F2A93B; --accent-ink: #1B1205; --accent-soft: rgba(242,169,59,.14);
  --alert: #EA5F4C; --alert-soft: rgba(234,95,76,.14); --good: #4FC38A; --warn: #F2C94C; --cool: #4DB6C9;
  --f-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0); background-size: 22px 22px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; letter-spacing: .01em; }
h2 { font-size: 26px; font-weight: 700; text-transform: uppercase; }
h3 { font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ico { flex: none; display: inline-block; vertical-align: middle; }

/* Top bar */
.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; }
.brand .ico { color: var(--accent); }
.turnbox { display: flex; align-items: stretch; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; font-family: var(--f-mono); font-size: 12px; }
.turnbox span { padding: 4px 10px; display: flex; align-items: center; gap: 6px; }
.turnbox .t { background: var(--accent); color: var(--accent-ink); font-weight: 600; letter-spacing: .08em; }
.turnbox .clock { border-left: 1px solid var(--line2); color: var(--accent); }
.turnbox .clock.red { color: var(--alert); }
.who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
nav.tabs { background: var(--panel); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs a { display: flex; align-items: center; gap: 15px; padding: 10px 14px 9px; color: var(--muted); text-decoration: none; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a[aria-current="page"] .ico { color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }
nav.tabs .tico { position: relative; display: inline-flex; }
.badge { position: absolute; top: -7px; right: -11px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--alert); color: #fff; font-family: var(--f-mono); font-size: 10px; font-weight: 600; line-height: 17px; text-align: center; letter-spacing: 0; box-shadow: 0 0 0 2px var(--panel); }
.badge.dot { min-width: 9px; width: 9px; height: 9px; padding: 0; top: -2px; right: -4px; background: var(--accent); }

/* Identity block in the header */
.ident { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 6px; border: 1px solid var(--line2); border-radius: 6px; background: var(--panel2); }
.ident-t { display: grid; line-height: 1.15; }
.ident-t .label { font-size: 9.5px; }
.ident-t strong { font-family: var(--f-display); font-size: 17px; letter-spacing: .03em; text-transform: uppercase; }
.crown { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.crown.big { width: 52px; height: 52px; }
.viewas { width: auto; padding: 6px 10px; font-size: 13px; }
.viewas.on { border-color: var(--accent); color: var(--accent); }
.flag { display: inline-block; vertical-align: middle; flex: none; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.45)); }
.globe-badge { display: inline-grid; place-items: center; width: 24px; height: 16px; border-radius: 2px; background: var(--panel2); color: var(--cool); border: 1px solid var(--line2); }

/* "Your turn" status card */
.turncard { display: grid; grid-template-columns: minmax(0, 1.3fr) auto auto; gap: 16px 28px; align-items: center; padding: 16px 20px; border-radius: 8px; border: 1px solid rgba(242,169,59,.35);
  background: radial-gradient(120% 140% at 0% 0%, rgba(242,169,59,.16), transparent 55%), linear-gradient(180deg, var(--panel2), var(--panel)); }
.turncard .tc-id { display: flex; gap: 14px; align-items: center; min-width: 0; }
.turncard h2 { font-size: 24px; }
.tc-stats { display: flex; gap: 22px; }
.tc-stats > div { display: grid; text-align: center; min-width: 64px; }
.tc-stats b { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tc-stats span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tc-stats .ok b { color: var(--good); } .tc-stats .warn b { color: var(--accent); } .tc-stats .bad b { color: var(--alert); }
.tc-cta { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.tc-next { font-size: 13px; color: var(--muted); }
@media (max-width: 1000px) { .turncard { grid-template-columns: 1fr; } .tc-cta { justify-content: flex-start; } }

/* Ticker */
.ticker { background: #05090D; border-bottom: 1px solid var(--line); overflow: hidden; white-space: nowrap; font-size: 13.5px; }
.ticker .wrap { display: flex; align-items: center; gap: 12px; padding-block: 6px; }
.ticker .tag { font-family: var(--f-display); font-weight: 700; letter-spacing: .1em; background: var(--alert); color: #fff; padding: 1px 8px; border-radius: 2px; flex: none; }
.ticker .lane { overflow: hidden; flex: 1; min-width: 0; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.ticker .run { display: inline-block; }
.ticker .run span { margin-right: 48px; }
.ticker .run span::before { content: "◆"; color: var(--accent); margin-right: 10px; font-size: 10px; }
@media (prefers-reduced-motion: no-preference) { .ticker .run { animation: tick 70s linear infinite; } .ticker:hover .run { animation-play-state: paused; } }
@keyframes tick { to { transform: translateX(-50%); } }

/* HUD */
.hud { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .hud { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.gauge { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; min-width: 0; }
.gauge .ico { grid-row: span 2; color: var(--muted); }
.gauge .n { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
.gauge .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge .meter { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.gauge .meter i { display: block; height: 100%; background: var(--accent); }
.gauge.low .meter i { background: var(--alert); } .gauge.low .ico { color: var(--alert); }
.d { font-family: var(--f-mono); font-size: 11px; font-weight: 600; }
.d.up { color: var(--good); } .d.down { color: var(--alert); }

main { padding-block: 16px 64px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); background: var(--panel2); padding: 7px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--alert); color: #fff; border-color: var(--alert); }
.btn.small { padding: 3px 10px; font-size: 13px; }
.btn.big { padding: 12px 22px; font-family: var(--f-display); font-size: 19px; text-transform: uppercase; letter-spacing: .08em; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 7px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
textarea.code { font-family: var(--f-mono); font-size: 12px; min-height: 220px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-size: 11px; padding: 1px 7px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line2); letter-spacing: .04em; white-space: nowrap; }
.chip.hi { color: var(--good); } .chip.lo { color: var(--alert); } .chip.mid { color: var(--warn); }
.cc { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-mono); font-weight: 600; font-size: 11.5px; letter-spacing: .05em; padding: 1px 6px 1px 4px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--line2); white-space: nowrap; }
.cc i { width: 8px; height: 8px; border-radius: 1px; display: inline-block; }
.notice { padding: 10px 14px; border-radius: 4px; background: var(--accent-soft); border: 1px solid rgba(242,169,59,.35); }
.notice.alert { background: var(--alert-soft); border-color: rgba(234,95,76,.4); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h2 { color: var(--ink); }
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 400; white-space: nowrap; }
td.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Map board */
.board { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
main.wide { max-width: 1520px; }
@media (max-width: 980px) { .board { grid-template-columns: 1fr; } }
.mapbox { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 0; }
.mapbox svg.map { display: block; width: 100%; height: auto; }
.mapbox { background: #060C12; cursor: grab; }
.mapbox:active { cursor: grabbing; }
.map .bg { fill: transparent; }
.map .sphere { fill: url(#wo-sea); stroke: rgba(120,170,220,.25); stroke-width: 1; vector-effect: non-scaling-stroke; }
.map .grat { fill: none; stroke: rgba(120,170,220,.08); stroke-width: .6; vector-effect: non-scaling-stroke; }
.map .land { fill: url(#wo-hatch); stroke: #0A131C; stroke-width: .6; vector-effect: non-scaling-stroke; }
.map .landmass { filter: url(#wo-coast); }
.map .game { stroke: rgba(255,255,255,.22) !important; stroke-width: .7; }
.map .cap .star { fill: #fff; stroke: #05090D; stroke-width: .6; pointer-events: none; }
.map .cap.mine .star { fill: var(--accent); }
.map .cap .pulse { fill: none; stroke: var(--accent); stroke-width: 1.4; opacity: 0; pointer-events: none; transform-box: fill-box; transform-origin: center; }
.map .cap.on .pulse { opacity: .9; }
@media (prefers-reduced-motion: no-preference) { .map .cap.on .pulse { animation: pulse 1.8s ease-out infinite; } .map .link { animation: march 1s linear infinite; } }
@keyframes pulse { from { transform: scale(.4); opacity: .95; } to { transform: scale(2.2); opacity: 0; } }
@keyframes march { to { stroke-dashoffset: -18; } }
.map .capname { font-family: var(--f-body); font-size: 7px; font-weight: 600; fill: #E8EEF4; paint-order: stroke; stroke: rgba(5,9,13,.9); stroke-width: 2px; pointer-events: none; }
.map .lbl.name { font-family: var(--f-display); font-weight: 700; letter-spacing: .12em; fill: rgba(255,255,255,.92); }
.goto { position: absolute; top: 48px; left: 10px; max-width: 200px; padding: 3px 8px; font-size: 13px; background: rgba(10,16,23,.85); }
.map .game { cursor: pointer; stroke: rgba(5,9,13,.9); }
@media (prefers-reduced-motion: no-preference) { .map .game { transition: fill .35s, fill-opacity .35s; } }
.map .game:hover { filter: brightness(1.3); }
.gmo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.gmo { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; }
.gmo-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .gmo-h .chip { margin-left: auto; }
.gmo-c { display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: 13.5px; border-left: 3px solid var(--cc); padding-left: 8px; }
.gmo-c svg { color: var(--cc); margin-top: 2px; }
.how-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.how-steps > div { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
.how-steps b { font-family: var(--f-display); letter-spacing: .04em; }
.how-steps span { color: var(--muted); }
.inbox-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.inbox-t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 640px) { .inbox-row { grid-template-columns: auto 1fr; } .inbox-row > .row { grid-column: 1 / -1; } }
.map .world { cursor: pointer; stroke: rgba(5,9,13,.9); stroke-width: .5; }
.map .world:hover { filter: brightness(1.45); }
.map .lbl.wl { font-family: var(--f-display); font-weight: 600; letter-spacing: .08em; fill: rgba(255,255,255,.5); text-transform: uppercase; }
.mapbox.fog .world { pointer-events: none; }
.map .selpath { fill: none; stroke: var(--accent); stroke-width: 2.2; vector-effect: non-scaling-stroke; filter: url(#wo-glow); pointer-events: none; }
.map .lbl { font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; fill: #fff; paint-order: stroke; stroke: rgba(5,9,13,.9); stroke-width: 2.5px; stroke-linejoin: round; pointer-events: none; letter-spacing: .04em; }
.map .pin { fill: var(--accent); stroke: #05090D; stroke-width: 1.2; vector-effect: non-scaling-stroke; pointer-events: none; }
.map .link { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; pointer-events: none; opacity: .85; }
.maptip { position: absolute; z-index: 3; pointer-events: none; background: rgba(10,16,23,.95); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; font-size: 13px; min-width: 170px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.tipstats { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; margin-top: 6px; font-size: 12px; }
.tipstats span:nth-child(odd) { color: var(--muted); }
.tipstats span:nth-child(even) { font-family: var(--f-mono); text-align: right; }
.zoombar { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.zoombar .modes button { font-size: 12px; padding: 3px 8px; }
.zoombar .z { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--line2); background: rgba(10,16,23,.85); color: var(--ink); cursor: pointer; font-size: 16px; line-height: 1; }
@media (max-width: 700px) { .legend { display: none; } }
.maptools { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; pointer-events: none; }
.maptools > * { pointer-events: auto; }
.modes { display: flex; gap: 2px; background: rgba(10,16,23,.85); border: 1px solid var(--line2); border-radius: 4px; padding: 2px; flex-wrap: wrap; }
.modes button { border: 0; background: transparent; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.readout { background: rgba(10,16,23,.85); border: 1px solid var(--line2); border-radius: 4px; padding: 4px 10px; font-family: var(--f-mono); font-size: 12px; min-height: 26px; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; background: rgba(10,16,23,.85); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dossier { display: grid; gap: 14px; align-content: start; }
.dossier .head { display: grid; gap: 4px; }
.dossier .name { font-family: var(--f-display); font-size: 30px; font-weight: 800; text-transform: uppercase; line-height: 1; display: flex; align-items: center; gap: 10px; }
.dossier .name .swatch { width: 16px; height: 16px; }
.lvl { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; }
.lvl .ico { color: var(--muted); }
.seg { display: flex; gap: 3px; }
.seg i { width: 18px; height: 6px; border-radius: 1px; background: var(--line); }
.seg.l1 i:nth-child(-n+1) { background: var(--alert); }
.seg.l2 i:nth-child(-n+2) { background: var(--warn); }
.seg.l3 i:nth-child(-n+3) { background: var(--good); }
.rank { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.rank:last-child { border-bottom: 0; }
.rank b { font-family: var(--f-mono); color: var(--muted); font-weight: 400; font-size: 12px; }
.rank.me { color: var(--accent); }
.fallback-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; padding: 52px 10px 50px; }
.fallback-grid button { border: 1px solid var(--line2); border-radius: 4px; padding: 10px; text-align: left; cursor: pointer; color: #05090D; font-weight: 600; }

/* Hero (season start) */
.hero { position: relative; overflow: hidden; border: 1px solid var(--line2); border-radius: 6px; background: linear-gradient(180deg, rgba(242,169,59,.10), transparent 60%), var(--panel); padding: 28px; display: grid; gap: 14px; }
.hero h1 { font-size: clamp(34px, 6vw, 60px); font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.hero p { max-width: 60ch; color: var(--muted); font-size: 16px; }

/* Orders as cards */
.ordersbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; justify-content: space-between; }
.tokens { display: flex; gap: 8px; align-items: center; }
.tok { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; color: var(--accent); }
.tok.used { background: var(--accent); color: var(--accent-ink); }
.tok.over { border-color: var(--alert); background: var(--alert); color: #fff; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line2); background: var(--panel2); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--muted); }

/* News pictures */

/* Diplomacy */
.dip { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; height: calc(100vh - 290px); height: calc(100dvh - 290px); min-height: 440px; max-height: 920px; }

.chan { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; border: 0; background: transparent; padding: 8px; border-radius: 6px; cursor: pointer; }

.relpip { width: 8px; height: 8px; border-radius: 50%; }

.thread { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; min-height: 0; overflow: hidden; }

.treaty { min-width: 260px; max-width: 420px; border: 1px solid rgba(242,169,59,.5); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px;
  background: linear-gradient(180deg, rgba(242,169,59,.10), rgba(242,169,59,.03)), var(--panel2); }

function apUsed() { return S.draft.actions.reduce((a, x) => a + (x.cost || 0), 0) + (S.draft.free.trim() ? 1 : 0); }

function cantAdd(key, target) {

  if (d.cost > left) return left <= 0 ? `No action points left this turn. Remove an order first.` : `"${d.label}" costs ${d.cost} AP but you have ${left} left.`;
  if (target) {
    if (S.draft.actions.some(a => a.key === key && a.target === target)) return `"${d.label}" with ${cname(target)} is already in your plan.`;
    const opp = { improve: 'denounce', denounce: 'improve' }[key];
    if (opp && S.draft.actions.some(a => a.key === opp && a.target === target)) return `You can't improve relations with and denounce ${cname(target)} in the same turn.`;
  } else if (!d.target && S.draft.actions.some(a => a.key === key)) return `"${d.label}" is already in your plan.`;

}
function planProblem() {

  if (apUsed() > AP_PER_TURN) return `You're ${apUsed() - AP_PER_TURN} AP over the limit. Remove an order first.`;
  return null;
}

/* Treaty proposal limits: PROPOSALS_PER_TURN per country per turn, and one open proposal per pair at a time. The GM is not limited. */
function proposalStats(me) {

  const sent = ms.filter(m => m.kind === 'proposal' && m.author === me && m.turn === S.game?.turn).length;
  const open = ch => ms.find(m => m.kind === 'proposal' && m.ch === ch && !answered.has(m.id));
  return { sent, open };
}
function proposalProblem() {
  if (gmView()) return null; const me = myCode(); if (!me || !S.channel.startsWith('dm:')) return null;
  const { sent, open } = proposalStats(me), o = open(S.channel);
  if (o) return o.author === me ? 'Your last proposal here has no answer yet. Wait for a reply before proposing another.' : 'They proposed a treaty to you. Accept or decline it first.';
  if (sent >= PROPOSALS_PER_TURN) return `You've sent ${PROPOSALS_PER_TURN} treaty proposals this turn, the limit. You can propose again next turn.`;
  return null;
}

}

/* ----- Diplomacy ----- */
function viewDiplomacy() {
  const mine = myCode();
  const npcCodes = sortedCodes().filter(c => !S.countries[c].player);
  let me = mine;
  if (gmView()) { if (!S.ui.speakAs || !knownCode(S.ui.speakAs)) S.ui.speakAs = npcCodes[0] || sortedCodes()[0]; me = S.ui.speakAs; }
  const msgs = allMsgs(); const um = unreadMap();
  const valid = ['assembly', ...(me ? everyCode().filter(c => c !== me).map(c => channelFor(me, c)) : [])];
  if (!valid.includes(S.channel)) S.channel = 'assembly';
  const ch = S.channel; const thread = msgs.filter(m => m.ch === ch);
  const replies = {}; msgs.forEach(m => { if (m.ref) replies[m.ref] = m; });
  const canPost = !!me && !!S.me?.id;
  const isDM = ch.startsWith('dm:');
  const cp = isDM ? ch.slice(3).split('-').find(c => c !== me) : null;
  const lastMsg = id => { const l = msgs.filter(m => m.ch === id); return l[l.length - 1]; };
  const preview = id => { const m = lastMsg(id); if (!m) return ''; const t = m.kind === 'proposal' ? 'Treaty proposal' : m.kind === 'accept' ? 'Accepted a proposal' : m.kind === 'decline' ? 'Declined a proposal' : m.text; return (m.author === me ? 'You: ' : '') + t; };

      ${code ? flag(code, 20) : `<span class="globe-badge big">${ico('globe', 16)}</span>`}
      <span class="chan-t"><span class="chan-n">${code ? esc(cname(code)) : 'World Assembly'}${code && S.countries[code]?.player ? '<span class="pl" title="Human player">P</span>' : ''}</span>
      <span class="chan-p">${esc(preview(id) || (code ? `${relLevel(v)[1]} ${v > 0 ? '+' : ''}${v}` : 'Public · every leader'))}</span></span>
      ${n ? `<span class="cnt">${n}</span>` : code ? `<span class="relpip" style="background:${col}" title="${relLevel(v)[1]} ${v}"></span>` : ''}</button>`; };
  let list = item('assembly', null);
  if (me) {
    const others = sortedCodes().filter(c => c !== me).map(c => [c, rel(me, c)]);
    const recent = c => lastMsg(channelFor(me, c))?.ts || 0;
    const group = (title, arr) => arr.length ? `<div class="chan-h">${title}<span>${arr.length}</span></div>` + arr.sort((x, y) => (recent(y[0]) - recent(x[0])) || (y[1] - x[1])).map(([c]) => item(channelFor(me, c), c)).join('') : '';
    list += group('Allies & friends', others.filter(x => x[1] >= 25)) + group('Neutral', others.filter(x => x[1] > -25 && x[1] < 25)) + group('Rivals', others.filter(x => x[1] <= -25));
    const bg = backgroundCodes().filter(c => c !== me && !sortedCodes().includes(c) && (lastMsg(channelFor(me, c)) || channelFor(me, c) === ch)).map(c => [c, rel(me, c)]);
    list += group('Rest of the world', bg);
    list += `<div class="chan-h">Contact any nation</div><select id="contactNation" data-change="contactNation" aria-label="Contact another nation" style="margin:4px 0 8px"><option value="">Choose a country…</option>${backgroundCodes().filter(c => c !== me).map(c => `<option value="${c}">${esc(cname(c))}</option>`).join('')}</select>`;
  }
  const head = isDM
    ? `<div class="thread-h">${flag(cp, 30)}<div class="stack" style="gap:2px;flex:1;min-width:0"><h3>${esc(cname(cp))}</h3><span class="muted" style="font-size:12.5px">${isBackground(cp) && !isBackground(me) ? `Private channel · ${esc(cname(cp))} is AI-run; its government answers through the Game Master` : `Private channel · only ${esc(cname(me))}, ${esc(cname(cp))} and the Game Master can read it`}</span></div>
       <div class="stack" style="gap:6px;justify-items:end">${relChip(rel(me, cp))}<span style="width:160px">${relBar(rel(me, cp))}</span></div></div>
       ${relButtons(cp) ? `<div class="row">${relButtons(cp)}</div>` : ''}`
    : `<div class="thread-h"><span class="globe-badge huge">${ico('globe', 22)}</span><div class="stack" style="gap:2px"><h3>World Assembly</h3><span class="muted" style="font-size:12.5px">Public · every leader and the press can read speeches here</span></div></div>`;
  return `
  ${gmView() ? aiInboxHtml() : ''}
  ${gmView() ? `<div class="panel row"><span class="label">Speak as</span><select id="speakAsSel" data-change="speakAs" style="max-width:280px"><optgroup label="In play">${sortedCodes().map(c => `<option value="${c}" ${c === me ? 'selected' : ''}>${esc(cname(c))}${S.countries[c].player ? ' (player)' : ''}</option>`).join('')}</optgroup><optgroup label="Rest of the world">${backgroundCodes().map(c => `<option value="${c}" ${c === me ? 'selected' : ''}>${esc(cname(c))}</option>`).join('')}</optgroup></select><span class="muted" style="font-size:13px">You see every channel of the country you pick. Players see only their own.</span></div>` : ''}
  ${!mine && !S.isGM ? `<div class="notice">You can read the World Assembly. Press Join the season on the World screen to take part.</div>` : ''}
  <div class="dip">
    <nav class="panel channels" aria-label="Channels">${list}</nav>
    <section class="panel thread">
      <div class="stack" style="gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px">${head}</div>
      <div class="msgs" id="msgs">${thread.length ? thread.map((m, i) => msgHtml(m, me, replies, thread[i - 1])).join('') : `<div class="empty" style="padding:30px 10px">${isDM ? `${flag(cp, 40)}<p>No messages with ${esc(cname(cp))} yet. Open with a greeting, an offer or a warning.</p>` : `${ico('globe', 36)}<p>The Assembly is quiet. Give the first speech.</p>`}</div>`}</div>
      ${canPost ? `<div class="composer">
        ${isDM && S.ui.propOpen ? `<div class="propbox"><span class="label">${ico('pen', 12)} Treaty proposal to ${esc(cname(cp))}</span><div class="grid2" style="gap:8px"><select id="propType" data-bind="ui.propType">${AGREEMENT_TYPES.map(([k, l]) => `<option value="${k}" ${S.ui.propType === k ? 'selected' : ''}>${l}</option>`).join('')}</select><input type="text" id="propTerms" data-bind="ui.propTerms" value="${esc(S.ui.propTerms)}" placeholder="Terms, e.g. 5% tariff cut on cars for 1 year"></div></div>` : ''}
        <div class="compose-row"><textarea id="compose" data-bind="ui.compose" rows="2" placeholder="${isDM ? `Message ${esc(cname(cp))}… (Enter to send)` : 'Address the Assembly… (Enter to send)'}">${esc(S.ui.compose)}</textarea>
        <button class="btn primary send" data-act="send" aria-label="Send">${isDM && S.ui.propOpen ? 'Propose' : 'Send'}</button></div>
        <div class="row" style="justify-content:space-between">${isDM ? `<button class="btn small" data-act="toggleProp">${S.ui.propOpen ? 'Cancel proposal' : ico('pen', 13) + ' Propose a treaty'}</button>${!gmView() && isDM && !S.ui.propOpen ? `<span class="muted" style="font-size:12px;margin-left:8px">${proposalStats(me).sent}/${PROPOSALS_PER_TURN} proposals this turn</span>` : ''}` : '<span></span>'}
        <span class="muted" style="font-size:12px">${flag(me, 10)} Sending as ${esc(cname(me))} · only accepted treaties bind</span></div></div>` : ''}
    </section>
  </div>`;
}
function msgHtml(m, me, replies, prev) {
  const mine = m.author === me; const time = m.ts ? new Date(m.ts) : null;
  const grouped = prev && prev.author === m.author && (m.ts - prev.ts) < 5 * 60 * 1000 && m.kind === 'msg' && prev.kind === 'msg';
  const when = time ? time.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const meta = grouped ? '' : `<div class="meta"><strong>${esc(cname(m.author))}</strong><span>${m.turn ? `Turn ${m.turn}` : ''}${when ? ' · ' + when : ''}</span></div>`;
  const av = grouped ? '<span class="av"></span>' : `<span class="av">${flag(m.author, 18)}</span>`;
  let body;
  if (m.kind === 'proposal') {
    const r = replies[m.id]; const toMe = !mine && m.ch.includes(me);
    body = `<div class="treaty"><div class="treaty-h">${ico('pen', 14)} Treaty proposal</div><strong class="treaty-t">${esc(typeLabel(m.proposal?.type))}</strong>${m.proposal?.terms ? `<p>${esc(m.proposal.terms)}</p>` : ''}${m.text ? `<p class="muted">${esc(m.text)}</p>` : ''}
      <div class="row" style="margin-top:4px">${r ? `<span class="chip ${r.kind === 'accept' ? 'hi' : 'lo'}">${r.kind === 'accept' ? '✓ Accepted' : '✕ Declined'} by ${esc(cname(r.author))}</span>` : toMe ? `<button class="btn small primary" data-act="reply" data-kind="accept" data-id="${m.id}" data-ch="${m.ch}">Accept</button><button class="btn small" data-act="reply" data-kind="decline" data-id="${m.id}" data-ch="${m.ch}">Decline</button>` : `<span class="chip">Awaiting answer</span>`}</div></div>`;
  } else if (m.kind === 'accept' || m.kind === 'decline') body = `<div class="body sys">${m.kind === 'accept' ? '✓ Accepted the treaty proposal.' : '✕ Declined the treaty proposal.'}</div>`;
  else body = `<div class="body">${esc(m.text)}</div>`;
  const mod = S.isGM && m._path ? (S.ui.delPath === m._path
    ? `<div class="mod-confirm"><span>Delete this message for everyone?</span><button class="btn small danger" data-act="delMsg" data-path="${esc(m._path)}">Delete</button><button class="btn small" data-act="delCancel">Cancel</button></div>`
    : `<button class="mdel" data-act="delAsk" data-path="${esc(m._path)}" title="Delete message" aria-label="Delete message">${ico('x', 12)}</button>`) : '';
  return `<div class="msg ${mine ? 'mine' : ''} ${grouped ? 'grouped' : ''}">${av}<div class="mcol">${meta}<div class="mrow">${body}${mod}</div></div></div>`;
}

    articles: arr(o.articles).map(x => ({ title: String(x.title || ''), body: String(x.body || ''), countries: arr(x.countries).map(v => String(v).toUpperCase()), image_prompt: String(x.image_prompt || '') })),
    imgs: {},
    markets: String(o.markets || ''), rumours: arr(o.rumours).map(String),
    changes: arr(o.changes).map(x => ({ country: String(x.country || '').toUpperCase(), stat: String(x.stat || '').toLowerCase(), delta: Number(x.delta) || 0, reason: String(x.reason || '') })),
    briefings: arr(o.briefings).map(x => ({ country: String(x.country || '').toUpperCase(), text: String(x.text || '') })),
    agreements: { add: arr(o.agreements?.add).map(x => ({ type: String(x.type || 'custom'), parties: arr(x.parties).map(v => String(v).toUpperCase()), terms: String(x.terms || '') })), end: arr(o.agreements?.end).map(String) },

    policies: arr(o.policies).map(x => ({ country: String(x.country || '').toUpperCase(), tax: x.tax ? String(x.tax).toLowerCase() : undefined, defence: x.defence ? String(x.defence).toLowerCase() : undefined })),
    npc_next: arr(o.npc_next).map(x => ({ country: String(x.country || ''), plan: String(x.plan || '') })), warnings };

function autoEffects() {
  const g = S.game, out = { policy: {}, budget: {}, rel: {} };

async function drawCountries(reshuffle) {

function route() { const h = location.hash.slice(1); S.view = ['map','nation','orders','diplomacy','news','gm','profile'].includes(h) ? h : 'map'; S.err = ''; render(); }
window.addEventListener('hashchange', route);

/* ---------- Data wiring (Firebase) ---------- */
const ALLOWED_DOMAIN = 'newuu.uz';
/* Club Telegram bot (ppbot on Cloudflare Workers). Leave empty until the bot side is deployed; fill in its public URL then. */
const BOT_API = 'https://ppbot-cloudflare.gsegmess.workers.dev'; // bot: @newuu_ppbot
async function botCall(path, body) {
  if (!BOT_API) throw new Error('bot not configured');
  const token = await S.auth.getToken();
  const r = await fetch(BOT_API + path, { method: body === undefined ? 'GET' : 'POST', headers: { Authorization: 'Bearer ' + token, ...(body === undefined ? {} : { 'Content-Type': 'application/json' }) }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) throw new Error('bot ' + r.status);
  return r.json();
}
function botEvent(ev) { if (!BOT_API || !S.auth) return; botCall('/wo/event', ev).catch(e => console.warn('bot event failed', e)); }
async function tgRefresh() { if (!BOT_API) return; S.tg = { loading: true }; render(); try { S.tg = await botCall('/wo/link-status'); } catch (e) { S.tg = { error: true }; } render(); }
const backendReady = new Promise(r => { window.__setBackend = r; });
function emailAllowed(email) { return !!email && email.toLowerCase().endsWith('@' + ALLOWED_DOMAIN); }
function makeUser(fbUser) {
  const cache = {};
  return {
    profiles: async ids => {
      const out = {};
      await Promise.all([...new Set(ids)].map(async id => {
        if (!(id in cache)) {
          if (String(id).startsWith('test-')) cache[id] = '';
          else { try { const s = await S.db.doc('profiles/' + id).get(); cache[id] = s.exists ? (s.data().name || '') : ''; } catch (e) { cache[id] = ''; } }
        }
        out[id] = { id, name: cache[id] };
      }));
      return out;
    },
  };
}
async function refreshNames() {
  if (!S.user) return;
  const ids = new Set(); Object.values(S.countries).forEach(c => c.player && ids.add(c.player)); Object.keys(S.claims).forEach(u => ids.add(u));
  if (!ids.size) return;
  const ps = await S.user.profiles([...ids]); let changed = false;
  for (const [id, p] of Object.entries(ps)) { const n = p.name || ''; if (S.names[id] !== n) { S.names[id] = n; changed = true; } }
  if (changed) render();
}
/* Messages live in channels/<channel>/msgs. The database only lets the two countries in a private channel (and the GM) read it. */
const chanSubs = {}, contactSub = {};
function noteContact(ch) {
  const [a, b] = ch.slice(3).split('-');
  [[a, b], [b, a]].forEach(([x, y]) => { if (!S.countries[x] || (!S.isGM && x !== myCode()) || S.contacts?.[y] && x === myCode()) return;
    S.db.doc('contacts/' + x).set({ [y]: true }, { merge: true }).catch(() => {}); });
}
function syncChannels() {
  if (!S.db || !S.me?.id) return;
  if (S.isGM) {
    if (!chanSubs.__all) chanSubs.__all = S.db.group('msgs').limit(4000).onSnapshot(s => { const by = {}; s.docs.forEach(d => { const m = { id: d.id, ...d.data() }; m._path = `channels/${m.ch}/msgs/${d.id}`; (by[m.ch] ||= []).push(m); }); S.msgs = by; render(); }, e => console.warn('messages', e));
    return;
  }
  const mine = myCode(); const want = new Set(['assembly']);
  /* Contacts with background nations live in contacts/<CODE>, private to that country's leader and the GM. */
  if (contactSub.code !== mine) { if (contactSub.off) contactSub.off(); contactSub.off = null; contactSub.code = mine; S.contacts = {};
    if (mine && !S.playAs) contactSub.off = S.db.doc('contacts/' + mine).onSnapshot(s => { S.contacts = s.exists ? s.data() : {}; syncChannels(); render(); }, () => {}); }
  if (mine) {
    allCodes().forEach(c => { if (c !== mine) want.add(channelFor(mine, c)); });
    Object.keys(S.contacts || {}).forEach(c => { if (c !== mine) want.add(channelFor(mine, c)); });
    if (S.channel.startsWith('dm:') && S.channel.slice(3).split('-').includes(mine)) want.add(S.channel);
  }
  for (const ch of Object.keys(chanSubs)) if (!want.has(ch)) { chanSubs[ch](); delete chanSubs[ch]; delete S.msgs[ch]; }
  for (const ch of want) if (!chanSubs[ch]) chanSubs[ch] = S.db.collection(`channels/${ch}/msgs`).orderBy('ts', 'desc').limit(150).onSnapshot(s => { S.msgs[ch] = s.docs.map(d => ({ id: d.id, ...d.data(), _path: `channels/${ch}/msgs/${d.id}` })); render(); }, e => console.warn(ch, e));
}
function syncOutboxes() { syncChannels(); }
async function boot() {

  db.collection('news').orderBy('turn', 'desc').limit(15).onSnapshot(s => { S.news = {}; s.docs.forEach(d => S.news[d.id] = d.data()); render(); }, () => {});
  db.doc('world/agreements').onSnapshot(s => { S.agreements = s.exists ? (s.data().list || []) : []; render(); }, () => {});
  db.doc('world/results').onSnapshot(s => { S.results = s.exists ? s.data() : null; render(); }, () => {});
  db.doc('votes/' + u.uid).onSnapshot(s => { S.myVote = s.exists ? s.data() : null; render(); }, () => {});
  db.doc('world/relations').onSnapshot(s => { S.relExists = s.exists; S.relDoc = s.exists ? s.data() : null; S.relations = s.exists ? (s.data().pairs || {}) : null; render(); }, () => {});
  db.doc('orders/' + u.uid).onSnapshot(s => { S.myOrder = s.exists ? s.data() : null; if (S.myOrder?.turn === S.draft.turn && !S.draft.actions.length && !S.draft.free) S.draft.turn = null; render(); }, () => {});
  db.collection(`briefings/${u.uid}/items`).onSnapshot(s => { S.briefings = {}; s.docs.forEach(d => S.briefings[d.id] = d.data()); render(); }, () => {});
  if (S.isGM) {
    try { S.playAs = localStorage.getItem('wo-playAs') || null; } catch (e) { S.playAs = null; }
    syncTestBriefings();
    db.collection('orders').onSnapshot(s => { S.allOrders = {}; s.docs.forEach(d => S.allOrders[d.id] = d.data()); render(); }, () => {});
    db.collection('votes').onSnapshot(s => { S.votes = {}; s.docs.forEach(d => S.votes[d.id] = d.data()); render(); }, () => {});
    db.doc('gm/notes').onSnapshot(s => { S.gm = s.exists ? s.data() : {}; render(); }, () => {});
  }
  syncChannels();
  render();
}
